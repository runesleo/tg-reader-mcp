[project]
name = "tg-reader-mcp"
version = "0.2.1"
description = "Telegram MCP server for reading channels, groups, and DMs plus guarded send/join actions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Leo", email = "hello@leolabs.me" },
]
keywords = ["mcp", "telegram", "telethon", "claude", "ai-agent", "readonly"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "telethon>=1.34.0,<1.44.0",
    "python-socks[asyncio]>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/runesleo/tg-reader-mcp"
Repository = "https://github.com/runesleo/tg-reader-mcp"
Issues = "https://github.com/runesleo/tg-reader-mcp/issues"
Author = "https://x.com/runes_leo"

[project.scripts]
tg-reader-mcp = "server:cli"
tg-reader-init = "tg_reader_init:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py", "tg_reader_init.py"]

[tool.hatch.build.targets.sdist]
only-include = ["server.py", "tg_reader_init.py", "README.md", "README.en.md", "CHANGELOG.md", "LICENSE"]
